title: "Participation Steward role"
date: "2026-07-29"
circle: connectors-circle
proposal: "Each community group appoints one or more Conversation Stewards. They balance freedom of expression with each group's shared purpose by gently guiding conversations and encouraging participation. The role is separate from the Group Leader role. The community will decide the election and implementation process separately."
outcome: "Put forward for decision. The minutes do not record the result."
